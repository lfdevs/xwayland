name: Build Check

on:
  pull_request:
    branches:
      - ubuntu/resolute

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    container:
      image: ubuntu:26.04
      options: --privileged --user root

    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt update
          apt build-dep -y xwayland
          apt install -y git ccache build-essential devscripts fakeroot quilt git-buildpackage pristine-tar

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /root/.ccache
          key: ccache-xwayland-ubuntu-resolute-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-xwayland-ubuntu-resolute-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --show-config
          ccache --zero-stats
          ccache --show-stats

      - name: Clone repository
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.html_url }}
        run: |
          cd ~
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone -b "$PR_HEAD_REF" --depth 1 "${PR_HEAD_REPO}.git" xwayland

      - name: Set release name suffix
        shell: bash
        run: |
          cd ~/xwayland
          short_hash=$(git rev-parse --short HEAD)
          echo "XWAYLAND_RELEASE_NAME_SUFFIX=${short_hash}_ubuntu_resolute_arm64" >> "$GITHUB_ENV"

      - name: Build Xwayland
        shell: bash
        run: |
          export CCACHE_DIR=/root/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          echo "Building Xwayland..."
          cd ~/xwayland
          origtargz
          gbp buildpackage -uc -us -jauto --git-ignore-branch
          echo "Xwayland build completed successfully!"

      - name: Save ccache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: /root/.ccache
          key: ccache-xwayland-ubuntu-resolute-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect packages
        shell: bash
        run: |
          cd ~
          rm -f -- *dev* *dbgsym*
          echo "Calculating sha256 checksums..."
          find . -maxdepth 1 \( -name "*.deb" \) -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums.txt
          cat sha256sums.txt && echo

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xwayland_${{ env.XWAYLAND_RELEASE_NAME_SUFFIX }}
          path: |
            ~/*.deb
            ~/sha256sums.txt
          retention-days: 90
